# Voice ERP kit — `make setup` (first time) or `make up`, then open http://localhost:5173
# Config: the single .env at the repo root (copy .env.example). Code changes reload live (bind mounts).
name: voice-erp-kit

x-common: &common
  env_file: .env
  restart: unless-stopped

services:
  backend:
    <<: *common
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { APP: backend } }
    image: voice-erp-kit/backend:dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 4000 --reload --reload-dir app --timeout-graceful-shutdown 2
    environment:
      API_PORT: "4000"
      DATA_DIR: /data
      DB_PATH: /db/erp.db
    volumes:
      - ./apps/backend/app:/app/apps/backend/app
      - ${DATA_DIR:-./data}:/data:ro
      - erp-db:/db
    ports: ["${API_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:4000/api/meta', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 40

  ai:
    <<: *common
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: { APP: ai, UV_SYNC_ARGS: "${AI_UV_SYNC_ARGS:-}", APT_PACKAGES: "${AI_APT_PACKAGES:-}" }  # optional extras (NVIDIA STT)
    image: voice-erp-kit/ai:dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 4100 --reload --reload-dir app --timeout-graceful-shutdown 2
    environment:
      AI_PORT: "4100"
      DATA_DIR: /data
      ERP_API_URL: http://backend:4000
      WA_URL: http://wa:3001
      AI_STATE_DIR: /state  # the AI service's own durable state (session memory); survives restart/recreate
    volumes:
      - ./apps/ai/app:/app/apps/ai/app
      - ${DATA_DIR:-./data}:/data:ro
      - ai-state:/state
    ports: ["${AI_PORT:-4100}:4100"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4100/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 40

  web:
    <<: *common
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: voice-erp-kit/web:dev
    environment:
      WEB_PORT: "5173"
      WEB_HOST: 0.0.0.0
      VITE_API_TARGET: http://backend:4000
      VITE_AI_TARGET: http://ai:4100
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src
    ports: ["${WEB_PORT:-5173}:5173"]
    depends_on:
      backend: { condition: service_healthy }
      ai: { condition: service_started }

  wa:
    <<: *common
    build: { context: ., dockerfile: docker/wa.Dockerfile }
    image: voice-erp-kit/wa:dev
    environment:
      WA_PORT: "3001"
      AI_URL: http://ai:4100
      WHATS_PROXY_STATE_DIR: /wa-state
    volumes:
      - wa-state:/wa-state
    ports:
      - "${WA_PORT:-3001}:3001"
      - "40000-40020:40000-40020/udp"
    depends_on:
      ai: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  erp-db:
  ai-state:
  wa-state:
